[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openeuv-abbe"
version = "0.1.0"
description = "Beginner-friendly EUV Abbe aerial-image GUI using EUVlitho/ELitho strict electromagnetic fields"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "OpenEUV Abbe contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "matplotlib>=3.5",
  "elitho @ git+https://github.com/takahashi-edalab/elitho.git@d9895cabe0557ab144d1cd0566e65888c215a7d1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
openeuv-abbe = "openeuv_abbe.gui:main"

[project.urls]
"EUVlitho upstream" = "https://github.com/takahashi-edalab/EUVlitho"
"ELitho solver" = "https://github.com/takahashi-edalab/elitho"

[tool.setuptools]
packages = ["openeuv_abbe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"
